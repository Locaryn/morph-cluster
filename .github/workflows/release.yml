name: Release Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Une extension qui ne compile pas ne doit pas partir en release : un paquet
  # qui n'embarque que des sources s'installe, s'affiche, et ne fait rien.
  check:
    name: Vérifier la compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked

      # La version du manifeste fait foi : une archive nommée d'après un tag
      # qui ne correspond pas au manifeste rend tout rapport de bug ambigu.
      - name: Le tag et le manifeste doivent concorder
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' morph.json | head -n 1)"
          test "v$VERSION" = "${GITHUB_REF_NAME}" \
            || { echo "::error::morph.json dit $VERSION, le tag dit ${GITHUB_REF_NAME}"; exit 1; }

  bundle:
    name: Bundle ${{ matrix.label }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux x86_64 et ARM64 (dont les machines NVIDIA GB10, cœur Grace en
      # ARM), Windows, macOS Apple Silicon — les quatre plateformes où
      # l'agent réseau et llama.cpp tournent réellement.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compiler l'agent, le serveur MCP et le lanceur
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          --bin locaryn-cluster-agent --bin locaryn-cluster-mcp --bin locaryn-cluster-launch

      # Le paquet ne contient que ce qui tourne chez l'utilisateur : le
      # manifeste, la compétence, la configuration MCP, le panneau et les
      # trois exécutables. Les sources restent sur le dépôt.
      - name: Assembler le paquet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle
          mkdir -p bundle/bin
          cp morph.json SKILL.md README.md LICENSE bundle/
          cp -r mcp dist bundle/
          for exe in locaryn-cluster-agent locaryn-cluster-mcp locaryn-cluster-launch; do
            cp "target/${{ matrix.target }}/release/${exe}${{ matrix.ext }}" bundle/bin/
            test -f "bundle/bin/${exe}${{ matrix.ext }}"
          done
          test -f bundle/morph.json
          test -f bundle/mcp/mcp.json
          # Chaque fichier que le manifeste nomme comme entrée d'interface doit
          # être dans le paquet : sans lui, le morph s'installe et son panneau
          # reste un cadre vide.
          for entree in $(sed -n 's/.*"entry"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' morph.json); do
            test -f "bundle/${entree}" || { echo "::error::${entree} absent du paquet"; exit 1; }
          done

      # Les artefacts ne conservent pas le bit exécutable ; le job de release
      # le repose avant d'archiver, sinon les programmes livrés ne démarrent
      # pas sous Linux et macOS.
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.label }}
          path: bundle
          if-no-files-found: error

  release:
    name: Publier la release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: bundle-*

      - name: Archiver chaque plateforme
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' morph.json | head -n 1)"
          test -n "$VERSION"
          mkdir -p out
          for dir in dl/bundle-*; do
            label="${dir#dl/bundle-}"
            chmod +x "$dir"/bin/* || true
            ( cd "$dir" && zip -r -q "$GITHUB_WORKSPACE/out/morph-cluster-v${VERSION}-${label}.zip" . )
          done
          ls -l out

      # Vérifier `bin/` dans l'archive avant de publier : c'est la ligne de CI
      # qui épargne une version installable mais inerte.
      - name: Vérifier les archives
        run: |
          set -euo pipefail
          test "$(ls out/*.zip | wc -l)" -eq 4
          for archive in out/*.zip; do
            for attendu in morph.json mcp/mcp.json SKILL.md; do
              unzip -l "$archive" | grep -q "$attendu" \
                || { echo "::error::$archive : $attendu manquant"; exit 1; }
            done
            for exe in locaryn-cluster-agent locaryn-cluster-mcp locaryn-cluster-launch; do
              unzip -l "$archive" | grep -Eq "bin/${exe}(\.exe)?$" \
                || { echo "::error::$archive ne contient pas $exe"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: morph-cluster-archives
          path: out/*.zip
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          name: "morph-cluster ${{ github.ref_name }}"
          files: out/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
