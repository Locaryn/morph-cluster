[package]
name = "locaryn-plugin-cluster"
version = "0.3.2"
edition = "2021"
description = "Official Locaryn Extension: pool GPU VRAM across networked machines via llama.cpp RPC to run models too large for one card"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

# L'agent : découverte réseau, pairage, gestion du serveur RPC local. Tourne
# en fond continu — le serveur MCP et le lanceur ne font que lui parler.
[[bin]]
name = "locaryn-cluster-agent"
path = "src/bin/cluster_agent.rs"

# Les outils : créer/rejoindre un cluster, lister les pairs, planifier,
# offrir son GPU. Client fin de l'agent.
[[bin]]
name = "locaryn-cluster-mcp"
path = "src/bin/cluster_mcp.rs"

# Le programme que le socle nomme dans `engine.lifecycle.start` : calcule le
# plan courant, lance `llama-server --rpc …`.
[[bin]]
name = "locaryn-cluster-launch"
path = "src/bin/cluster_launch.rs"

[dependencies]
# HTTP sans TLS : tout ce que ce paquet appelle par HTTP est en boucle locale
# (l'agent, le moteur). Omettre `rustls-tls` retire `ring` des dépendances.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# CPU et mémoire vive de la machine, pour le tableau de bord de perf du
# cluster (nom du GPU et VRAM restent sondés par nvidia-smi / llama.cpp,
# sysinfo ne les couvre pas de façon fiable sur toutes les cartes).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[workspace]
